# Railway Nixpacks config for the API service.
# Build context: monorepo root.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["corepack enable && corepack prepare pnpm@10.33.2 --activate", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @branchscout/api db:generate",
  "pnpm --filter @branchscout/api build",
]

[start]
cmd = "pnpm --filter @branchscout/api db:migrate:deploy && pnpm --filter @branchscout/api start"
