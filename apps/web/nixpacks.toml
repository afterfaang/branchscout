# Railway Nixpacks config for the Web service.
# Build context: monorepo root.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["corepack enable && corepack prepare pnpm@10.33.2 --activate", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @branchscout/web build"]

[start]
cmd = "pnpm --filter @branchscout/web start"
